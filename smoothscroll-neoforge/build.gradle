plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

version = mod_version
group = mod_group
base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
            // ТЕСТОВО (ветка runclient-test): харнесс и подключение к локальному серверу.
            systemProperty 'smoothscroll.selftest', 'true'
            programArguments.addAll('--quickPlayMultiplayer', 'localhost:25565')
        }
        server {
            server()
            programArguments.add('--nogui')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            mod_id          : mod_id,
            mod_name        : mod_name,
            mod_version     : mod_version,
            mod_license     : mod_license,
            mod_authors     : mod_authors,
            mod_description : mod_description,
            neo_version     : neo_version,
            minecraft_version: minecraft_version
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}
