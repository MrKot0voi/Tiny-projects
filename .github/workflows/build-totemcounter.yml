name: build totemcounter (neoforge 1.21.11)

on:
  push:
    paths:
      - 'totemcounter-neoforge/**'
      - '.github/workflows/build-totemcounter.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: totemcounter-neoforge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Dump Minecraft signatures (diagnostics)
        run: |
          ./gradlew createMinecraftArtifacts --no-daemon -q || true
          MC=""
          for j in $(find build "$HOME/.gradle" -name "*.jar" 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q "net/minecraft/client/gui/Gui.class"; then MC="$j"; break; fi
          done
          echo "=== MC jar: $MC"
          P() { echo "--- $1"; javap -p -cp "$MC" "$1" 2>/dev/null | grep -E "$2" || echo "(no match)"; }
          P net.minecraft.client.gui.Gui "render|minecraft"
          P net.minecraft.client.multiplayer.ClientPacketListener "handleEntityEvent|level;"
          P net.minecraft.client.renderer.GameRenderer "displayItemActivation|minecraft;"
          P net.minecraft.client.gui.components.ChatComponent "addMessage"
          P net.minecraft.client.renderer.entity.DisplayRenderer 'TextDisplay|extract'
          P 'net.minecraft.client.renderer.entity.DisplayRenderer$TextDisplayRenderer' "extract|splitLines"
          P net.minecraft.client.renderer.entity.state.TextDisplayEntityRenderState "cachedInfo"
          P net.minecraft.client.particle.ParticleEngine "createTrackingEmitter"

      - name: Build
        run: chmod +x gradlew && ./gradlew build --stacktrace --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: totemcounter-neoforge-1.21.11
          path: totemcounter-neoforge/build/libs/*.jar
          if-no-files-found: error
