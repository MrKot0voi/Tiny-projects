name: diag smoothscroll build log

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Build and capture log
        working-directory: smoothscroll-neoforge
        run: |
          mkdir -p "$GITHUB_WORKSPACE/diag"
          gradle build --stacktrace --no-daemon > "$GITHUB_WORKSPACE/diag/smoothscroll-build.log" 2>&1 || true
          grep -n "error:" "$GITHUB_WORKSPACE/diag/smoothscroll-build.log" | head -40 || true

      - name: Push log to branch
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan diag-smoothscroll-build
          git rm -rf -q --cached . || true
          git add -f diag/smoothscroll-build.log
          git commit -q -m "diag: smoothscroll build log"
          git push -f origin diag-smoothscroll-build
