name: diag creative signatures

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Dump creative signatures
        working-directory: smoothscroll-neoforge
        run: |
          gradle createMinecraftArtifacts --no-daemon -q || true
          MC=""
          for j in $(find build "$HOME/.gradle" -name "*.jar" 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q "net/minecraft/client/gui/screens/inventory/CreativeModeInventoryScreen.class"; then MC="$j"; break; fi
          done
          mkdir -p "$GITHUB_WORKSPACE/diag"
          OUT="$GITHUB_WORKSPACE/diag/creative.txt"
          {
            echo "MC jar: $MC"
            echo "##### SIGNATURES"
            for c in net.minecraft.client.gui.screens.inventory.CreativeModeInventoryScreen 'net.minecraft.client.gui.screens.inventory.CreativeModeInventoryScreen$ItemPickerMenu' net.minecraft.client.gui.screens.inventory.AbstractContainerScreen net.minecraft.world.inventory.Slot net.minecraft.client.gui.GuiGraphics net.minecraft.client.gui.components.AbstractScrollArea; do
              echo "=== $c"; javap -p -cp "$MC" "$c" 2>&1 || echo "(not found)"
            done
            echo "##### BYTECODE renderBg/render/renderSlots/renderSlot"
            for c in net.minecraft.client.gui.screens.inventory.CreativeModeInventoryScreen net.minecraft.client.gui.screens.inventory.AbstractContainerScreen; do
              echo "=== $c (bytecode)"; javap -p -c -cp "$MC" "$c" 2>&1 | awk '/void (renderBg|render|renderSlots|renderSlot|renderContents|extractRenderState|init|renderLabels)\(/{p=1} /^$/{p=0} p' || echo "(not found)"
            done
          } > "$OUT"
          wc -l "$OUT"

      - name: Push to diag-creative branch
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan diag-creative
          git rm -rf -q --cached . || true
          git add -f diag/creative.txt
          git commit -q -m "diag: creative signatures"
          git push -f origin diag-creative
