name: runclient smoothscroll (smoke test)

on:
  push:
    branches: [runclient-test]
    paths:
      - 'smoothscroll-neoforge/**'
      - '.github/workflows/runclient-smoothscroll.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  runclient:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: smoothscroll-neoforge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Install virtual display
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb libgl1 libgl1-mesa-dri libglu1-mesa xauth

      - name: Dump extra signatures (diagnostics)
        if: always()
        continue-on-error: true
        run: |
          gradle createMinecraftArtifacts --no-daemon -q || true
          bash tools/dump2.sh diag/dump2 || true

      - name: Run client (headless, 7 min)
        continue-on-error: true
        run: |
          set +e
          xvfb-run -a -s "-screen 0 1280x720x24" timeout 480 gradle runClient --no-daemon --stacktrace > runclient.log 2>&1
          echo "exit: $?" >> runclient.log
          pkill -f net.neoforged || true

      - name: Summarize log
        if: always()
        run: |
          mkdir -p diag
          L=runclient.log
          { echo "== exit line"; grep -E "^exit:" $L || echo "no exit line";
            echo "== gradle result"; grep -E "BUILD (SUCCESSFUL|FAILED)|What went wrong" -A3 $L | head -40;
            echo "== reached game (sound engine / main menu)"; grep -E "Sound engine started|Created: |Loaded .* mod|Forge Mod Loader|NeoForge" $L | head -20;
            echo "== selftest"; grep -E "SELFTEST" $L | head -40;
            echo "== mixin problems"; grep -E "Mixin apply failed|InvalidInjectionException|InvalidMixinException|Critical injection|MixinApplyError|Injection validation failed|Failed to apply mixin|smoothscroll.mixins" $L | head -60;
            echo "== errors and crashes"; grep -E "Exception|Crash|Caused by|ERROR" $L | grep -v "DEBUG" | head -80;
          } > diag/runclient-summary.txt
          tail -n 400 $L > diag/runclient-tail.txt
          cp $L diag/runclient-full.log || true
          ls -la diag

      - name: Commit results to branch
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f smoothscroll-neoforge/diag/runclient-summary.txt smoothscroll-neoforge/diag/runclient-tail.txt smoothscroll-neoforge/diag/dump2
          git commit -m "[skip ci] результат runClient smoothscroll" || echo "nothing to commit"
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push failed"

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runclient-log
          path: smoothscroll-neoforge/runclient.log
          if-no-files-found: warn
