name: verify armorhud (neoforge 1.21.11)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Build
        id: build
        working-directory: armorhud-neoforge
        run: |
          set +e
          gradle build --stacktrace --no-daemon > "$GITHUB_WORKSPACE/build.log" 2>&1
          echo "build exit: $?"
          tail -40 "$GITHUB_WORKSPACE/build.log"
          set -e

      - name: Dump Minecraft signatures
        working-directory: armorhud-neoforge
        run: |
          gradle createMinecraftArtifacts --no-daemon -q || true
          MC=""
          for j in $(find build "$HOME/.gradle" -name "*.jar" 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q "net/minecraft/client/gui/components/BossHealthOverlay.class"; then MC="$j"; break; fi
          done
          OUT="$GITHUB_WORKSPACE/diag/armorhud-javap.txt"
          mkdir -p "$GITHUB_WORKSPACE/diag"
          {
            echo "MC jar: $MC"
            for c in net.minecraft.client.gui.components.BossHealthOverlay net.minecraft.client.gui.components.SubtitleOverlay net.minecraft.world.inventory.InventoryMenu net.minecraft.client.Minecraft net.minecraft.client.gui.Font net.minecraft.client.KeyMapping; do
              echo "=== $c"
              javap -p -cp "$MC" "$c" 2>&1 || echo "(not found)"
            done
          } > "$OUT"
          wc -l "$OUT"

      - name: Run client under Xvfb
        working-directory: armorhud-neoforge
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglu1-mesa
          mkdir -p run
          set +e
          timeout 420 xvfb-run -a gradle runClient --no-daemon --stacktrace > "$GITHUB_WORKSPACE/runclient.log" 2>&1
          echo "runClient exit: $?"
          pkill -f "net.neoforged" || true
          set -e
          D="$GITHUB_WORKSPACE/diag/armorhud"
          mkdir -p "$D"
          cp run/logs/latest.log "$D/latest.log" 2>/dev/null || echo "no latest.log"
          cp -r run/crash-reports "$D/" 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/build.log" "$D/build.log" 2>/dev/null || true

      - name: Push results to branch
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan verify-armorhud
          git rm -rf -q --cached . || true
          git add -f diag
          git commit -q -m "verify armorhud results"
          git push -f origin verify-armorhud
