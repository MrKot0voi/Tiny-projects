name: dump glint strings

on:
  workflow_dispatch:
  push:
    branches: [armorchroma-glint]
    paths:
      - '.github/workflows/dump-glint-strings.yml'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: armorchroma-neoforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Dump enchanted/glint strings from MC jar
        run: |
          gradle createMinecraftArtifacts --no-daemon -q || true
          MC=""
          for j in $(find build "$HOME/.gradle" -name "*.jar" 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/client/gui/Gui.class'; then MC="$j"; break; fi
          done
          echo "MC=$MC"
          mkdir -p build/glint && cd build/glint && unzip -q -o "$MC" '*.class' 2>/dev/null || true
          cd "$GITHUB_WORKSPACE/armorchroma-neoforge"
          { echo "== class strings containing enchant/glint =="; grep -rahoE "[A-Za-z0-9_/.:-]*(enchant|glint|Glint|Enchant)[A-Za-z0-9_/.:-]*" build/glint | sort | uniq -c | sort -rn | head -150; } > build/glint.txt 2>&1 || true
      - name: Commit result
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p diag-glint
          cp armorchroma-neoforge/build/glint.txt diag-glint/glint.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f diag-glint
          git commit -m "[skip ci] glint strings" || echo "nothing"
          for i in 1 2 3; do git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
