name: build smoothscroll (neoforge 1.21.11)

permissions:
  contents: write

on:
  push:
    paths:
      - 'smoothscroll-neoforge/**'
      - '.github/workflows/build-smoothscroll.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smoothscroll-neoforge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Dump Minecraft signatures (diagnostics)
        if: always()
        continue-on-error: true
        run: |
          gradle createMinecraftArtifacts --no-daemon -q || true
          bash tools/dump-signatures.sh build/signatures || true

      - name: Commit signatures (diagnostics)
        if: always()
        continue-on-error: true
        run: |
          rm -rf diag/sigs
          mkdir -p diag/sigs
          cp -r build/signatures/. diag/sigs/ 2>/dev/null || true
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f smoothscroll-neoforge/diag
          git commit -m "[skip ci] диагностика сигнатур Mojang" || echo "nothing to commit"
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push failed"

      - name: Build
        run: gradle build --stacktrace --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: smoothscroll-neoforge-1.21.11
          path: smoothscroll-neoforge/build/libs/*.jar
          if-no-files-found: error
