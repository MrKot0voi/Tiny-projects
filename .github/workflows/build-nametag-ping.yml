name: build nametag-ping (neoforge 1.21.11)

on:
  push:
    paths:
      - 'nametag-ping-neoforge/**'
      - '.github/workflows/build-nametag-ping.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nametag-ping-neoforge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Build
        run: gradle build --stacktrace --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: nametag-ping-neoforge-1.21.11
          path: nametag-ping-neoforge/build/libs/*.jar
          if-no-files-found: error
