name: dump earlydisplay

on:
  workflow_dispatch:
  push:
    branches: [darkloading-early]
    paths:
      - '.github/workflows/dump-earlydisplay.yml'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download and dump earlydisplay
        run: bash darkloadingscreen-neoforge/tools/dump-earlydisplay.sh build/early || true
      - name: Commit dump
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p diag/early
          cp -r build/early/. diag/early/ 2>/dev/null || true
          rm -f diag/early/*.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f diag/early
          git commit -m "[skip ci] earlydisplay dump" || echo "nothing"
          for i in 1 2 3; do git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
