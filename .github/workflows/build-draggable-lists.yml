name: build draggable-lists (neoforge 1.21.11)

on:
  push:
    paths:
      - 'draggable-lists-neoforge/**'
      - '.github/workflows/build-draggable-lists.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: draggable-lists-neoforge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Build
        run: gradle build --stacktrace --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: draggable-lists-neoforge-1.21.11
          path: |
            draggable-lists-neoforge/build/libs/*.jar
            !draggable-lists-neoforge/build/libs/*-sources.jar
          if-no-files-found: error
