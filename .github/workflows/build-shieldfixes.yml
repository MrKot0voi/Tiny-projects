name: build shieldfixes (neoforge 1.21.11)

on:
  push:
    paths:
      - 'shieldfixes-neoforge/**'
      - '.github/workflows/build-shieldfixes.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build WalksyLib (NeoForge 1.21.11)
        run: |
          git clone --depth 1 https://github.com/Walksy/WalksyLib.git walksylib
          cd walksylib
          chmod +x gradlew
          ./gradlew :neoforge-1.21.11:jar -Pwalksylib.loaders=neoforge -Pwalksylib.versions=1.21.11 --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/shieldfixes-neoforge/libs"
          JAR=$(find build/loader/neoforge/1.21.11/build/libs -name "*.jar" ! -name "*sources*" | head -1)
          echo "WalksyLib jar: $JAR"
          cp "$JAR" "$GITHUB_WORKSPACE/shieldfixes-neoforge/libs/"

      - name: Upload WalksyLib jar
        uses: actions/upload-artifact@v4
        with:
          name: walksylib-neoforge-1.21.11
          path: shieldfixes-neoforge/libs/*.jar
          if-no-files-found: error

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Build ShieldFixes
        working-directory: shieldfixes-neoforge
        run: gradle build --stacktrace --no-daemon

      - name: Upload ShieldFixes jar
        uses: actions/upload-artifact@v4
        with:
          name: shieldfixes-neoforge-1.21.11
          path: shieldfixes-neoforge/build/libs/*.jar
          if-no-files-found: error
