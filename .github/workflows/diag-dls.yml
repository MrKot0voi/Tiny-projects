name: diag dls signatures

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Dump signatures
        working-directory: darkloadingscreen-neoforge
        run: |
          gradle createMinecraftArtifacts --no-daemon -q || true
          MC=""
          for j in $(find build "$HOME/.gradle" -name "*.jar" 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q "net/minecraft/client/gui/screens/LoadingOverlay.class"; then MC="$j"; break; fi
          done
          mkdir -p "$GITHUB_WORKSPACE/diag"
          OUT="$GITHUB_WORKSPACE/diag/dls-bytecode.txt"
          {
            echo "MC jar: $MC"
            for c in net.minecraft.client.gui.screens.LoadingOverlay; do
              echo "=== $c"
              javap -p -c -cp "$MC" "$c" 2>&1 || echo "(not found)"
            done
          } > "$OUT"
          wc -l "$OUT"

      - name: Push to diag-output branch
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin diag-output 2>/dev/null || true
          git checkout -B diag-output
          git add -f diag/dls-bytecode.txt
          git commit -m "diag: dls bytecode"
          git push -f origin diag-output
